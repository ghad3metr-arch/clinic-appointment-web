<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رزرو آنلاین | تن‌آرا</title><style>
:root{--g:#0e8b80;--g2:#e7f7f4;--ink:#174d49;--muted:#6d8885;--card:#fff;--bg:#f5fbfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#dff7f3,#bfece6);border-radius:28px;padding:24px;box-shadow:0 10px 30px #0e8b801c;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:#52716d;line-height:1.9}.card{background:var(--card);border:1px solid #dcefeb;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 24px #174d490c}label{display:block;font-weight:700;margin:10px 0 7px}select,input{width:100%;padding:13px;border:1px solid #cfe3df;border-radius:13px;background:#fff;font-size:16px;color:var(--ink)}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.slot{padding:12px 5px;border:1px solid #bfe1db;border-radius:12px;background:#f8fffd;color:var(--g);font-weight:700}.slot:disabled{opacity:.35}.slot.selected{background:var(--g);color:#fff}.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.day{padding:13px;border:1px solid #cfe3df;border-radius:14px;background:#fff;text-align:right}.day.active{border:2px solid var(--g);background:var(--g2)}button.primary{width:100%;border:0;background:var(--g);color:#fff;padding:15px;border-radius:15px;font-size:17px;font-weight:700;margin-top:12px}.note{background:#fff8df;border:1px solid #f0df9d;border-radius:14px;padding:12px;line-height:1.8;color:#725d1b}.ok{background:#e6f8ef;border:1px solid #b9e7cf;border-radius:15px;padding:15px;line-height:2}.err{background:#fff0f0;border:1px solid #f0c4c4;border-radius:15px;padding:15px;color:#8b3333;line-height:1.8}.small{font-size:13px;color:var(--muted)}a{color:var(--g)}@media(max-width:520px){.slots{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="hero"><h1>رزرو آنلاین تن‌آرا 🌿</h1><p>خدمت موردنظر را انتخاب کنید، زمان آزاد را ببینید و نوبت خود را ثبت کنید.</p></div><div id="msg"></div><div class="card"><label>خدمت</label><select id="service"><option>در حال بارگذاری...</option></select><div class="small" id="serviceInfo"></div></div><div class="card"><label>تاریخ</label><div class="days" id="days"></div></div><div class="card"><label>ساعت‌های آزاد</label><div id="slots" class="slots"></div><div class="small" id="slotInfo">ابتدا خدمت و تاریخ را انتخاب کنید.</div></div><div class="card"><label>نام و نام خانوادگی</label><input id="name" autocomplete="name"><label>شماره موبایل</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="مثلاً 0912..." ><button class="primary" id="submit">ثبت نوبت</button></div><div class="note">پس از ثبت موفق، نوبت برای مرکز تن‌آرا ثبت می‌شود و در پنل مدیریت قابل مشاهده خواهد بود.</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://bpqjeinlnslcmftzidmg.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_MK8vblyM7EqRu3bY8vEyPA_34oENuJP';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let cfg=null,services=[],availability=[],appointments=[],selectedDate='',selectedTime='',ownerId='';
const $=id=>document.getElementById(id);const msg=(html,cls='')=>{$('msg').innerHTML=html?`<div class="${cls}">${html}</div>`:''};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function faDate(iso){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date(iso+'T12:00:00'))}
function todayIso(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m} function hh(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function renderServices(){ $('service').innerHTML=services.map(s=>`<option value="${s.id}">${esc(s.name)} — ${Number(s.duration_minutes||0)} دقیقه${Number(s.price||0)?' · '+Number(s.price).toLocaleString('fa-IR')+' تومان':''}</option>`).join('');renderServiceInfo();}
function renderServiceInfo(){const s=services.find(x=>x.id===$('service').value);$('serviceInfo').textContent=s?`مدت خدمت: ${Number(s.duration_minutes||0).toLocaleString('fa-IR')} دقیقه`:' ';renderSlots()}
function renderDays(){const dates=[...new Set(availability.map(x=>x.slot_date))].sort();$('days').innerHTML=dates.map(d=>`<button class="day ${d===selectedDate?'active':''}" onclick="selectDate('${d}')">${faDate(d)}</button>`).join('')||'<div class="small">هنوز زمان آزادی برای رزرو ثبت نشده است.</div>';if(!selectedDate&&dates[0])selectDate(dates[0])}
window.selectDate=d=>{selectedDate=d;selectedTime='';renderDays();renderSlots()};
function renderSlots(){const s=services.find(x=>x.id===$('service').value);if(!s||!selectedDate){$('slots').innerHTML='';return}const dur=Number(s.duration_minutes||0);const taken=appointments.filter(a=>a.appointment_date===selectedDate&&a.status!=='cancelled').map(a=>({start:minutes((a.start_time||'').slice(0,5)),end:minutes((a.start_time||'').slice(0,5))+Number(a.duration_minutes||0)}));let out=[];for(const w of availability.filter(x=>x.slot_date===selectedDate)){const start=minutes(w.start_time.slice(0,5)),end=minutes(w.end_time.slice(0,5));for(let t=start;t+dur<=end;t+=15){const clash=taken.some(a=>t<a.end&&t+dur>a.start);out.push({t,disabled:clash||!isBookable(w)});}}const seen=new Set();out=out.filter(x=>!seen.has(x.t)&&seen.add(x.t));$('slots').innerHTML=out.map(x=>`<button class="slot ${selectedTime===hh(x.t)?'selected':''}" ${x.disabled?'disabled':''} onclick="selectTime('${hh(x.t)}')">${hh(x.t)}</button>`).join('')||'<div class="small">برای این تاریخ زمان آزادی پیدا نشد.</div>';$('slotInfo').textContent=out.length?'زمان‌های پرشده نمایش داده نمی‌شوند.':''}
function isBookable(w){const d=new Date(w.slot_date+'T23:59:00');const diff=Math.ceil((d-new Date())/86400000);return diff>=Number(w.min_booking_days||0)}window.selectTime=t=>{selectedTime=t;renderSlots()};
$('service').addEventListener('change',renderServiceInfo);$('submit').onclick=async()=>{msg('');const name=$('name').value.trim(),phone=$('phone').value.trim();const s=services.find(x=>x.id===$('service').value);if(!s||!selectedDate||!selectedTime||!name||!phone){msg('لطفاً خدمت، تاریخ، ساعت، نام و موبایل را کامل کنید.','err');return} $('submit').disabled=true;const {data,error}=await sb.rpc('create_public_booking',{p_owner_id:ownerId,p_full_name:name,p_phone:phone,p_service_id:s.id,p_appointment_date:selectedDate,p_start_time:selectedTime});if(error||!data?.ok){msg(esc(error?.message||data?.message||'ثبت نوبت انجام نشد.'),'err');$('submit').disabled=false;await loadData();return}msg(`نوبت شما با موفقیت ثبت شد.<br><b>${esc(s.name)}</b><br>${faDate(selectedDate)} — ساعت ${esc(selectedTime)}`,'ok');
try{await fetch(`${SUPABASE_URL}/functions/v1/tanara-push`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({appointment_id:data.appointment_id,owner_id:ownerId})})}catch(e){console.warn('booking notification',e)}
$('name').value='';$('phone').value='';selectedTime='';await loadData();$('submit').disabled=false};
async function loadData(){const {data,error}=await sb.rpc('get_public_booking_data');if(error){msg('صفحه رزرو هنوز در پایگاه‌داده فعال نشده است. لطفاً تنظیمات رزرو عمومی را تکمیل کنید.','err');return}cfg=data;ownerId=data.owner_id;services=data.services||[];availability=data.availability||[];appointments=data.appointments||[];renderServices();renderDays();renderSlots()}
loadData();
</script></body></html>
