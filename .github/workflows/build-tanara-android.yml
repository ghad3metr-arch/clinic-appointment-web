name: Build TanAra Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TanAra-Android-Widget-Source-2026-11-10.zip'
      - '.github/workflows/build-tanara-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          unzip -q TanAra-Android-Widget-Source-2026-11-10.zip -d extracted
          test -f extracted/TanAra-Android-Widget-Project/02-Android-App/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle -p extracted/TanAra-Android-Widget-Project/02-Android-App --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tanara-android-debug-apk
          path: extracted/TanAra-Android-Widget-Project/02-Android-App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
